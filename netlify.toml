[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NETLIFY = "true"
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Client routes → SPA (Netlify serves /api/* via the function path config first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
